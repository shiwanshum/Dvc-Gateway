stages:
  - test
  - code-quality
  - security-sast
  - security-sca
  - build
  - image-test
  - security-container
  - deploy
  - post-deploy-test

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  HARBOR_HOST: "img-hub.iot.tei"
  HARBOR_PROJECT: "dvc-gateway"
  FRONTEND_IMAGE_TAG: $HARBOR_HOST/$HARBOR_PROJECT/frontend:$CI_COMMIT_SHORT_SHA
  BACKEND_IMAGE_TAG: $HARBOR_HOST/$HARBOR_PROJECT/backend:$CI_COMMIT_SHORT_SHA
  K3S_APP_URL: "http://172.16.60.190" # Target URL for post-deploy dynamic testing

# -----------------------------------------------------
# 1. UNIT TESTING
# -----------------------------------------------------
unit-test-backend:
  stage: test
  image: golang:1.21-alpine
  before_script:
    - apk add --no-cache gcc musl-dev
    - go install github.com/jstemmer/go-junit-report/v2@latest
    - go install github.com/boumenot/gocover-cobertura@latest
  script:
    - go test -v -coverprofile=coverage.out ./... 2>&1 | go-junit-report -set-exit-code > report.xml
    - gocover-cobertura < coverage.out > coverage.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  allow_failure: false

unit-test-frontend:
  stage: test
  image: node:18-alpine
  script:
    - cd web/frontend
    - npm ci
    - npm run test --if-present
  artifacts:
    when: always
    reports:
      junit: web/frontend/junit.xml
  allow_failure: true

# -----------------------------------------------------
# 2. CODE QUALITY & LINTING
# -----------------------------------------------------
code-quality-backend:
  stage: code-quality
  image: golangci/golangci-lint:v1.54.2
  script:
    - golangci-lint run --out-format code-climate > gl-code-quality-report.json
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
  allow_failure: true

sonarqube-check:
  stage: code-quality
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script: 
    - sonar-scanner -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN
  allow_failure: true

# -----------------------------------------------------
# 3. SAST & SECRETS
# -----------------------------------------------------
semgrep-sast:
  stage: security-sast
  image: returntocorp/semgrep:latest
  script:
    - semgrep ci --gitlab-sast > gl-sast-report.json
  artifacts:
    reports:
      sast: gl-sast-report.json
  allow_failure: true

secret-detection:
  stage: security-sast
  image: zricethezav/gitleaks:latest
  script:
    - gitleaks detect --source . -v --report-path gl-secret-detection-report.json
  artifacts:
    reports:
      secret_detection: gl-secret-detection-report.json
  allow_failure: true

# -----------------------------------------------------
# 4. SCA (Package Vulnerability)
# -----------------------------------------------------
trivy-dependency-scanning:
  stage: security-sca
  image: aquasec/trivy:latest
  script:
    - trivy fs --format template --template "@contrib/gitlab.tpl" --output gl-dependency-scanning-report.json .
  artifacts:
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
  allow_failure: true

# -----------------------------------------------------
# 5. BUILD
# -----------------------------------------------------
build-backend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $HARBOR_USERNAME -p $HARBOR_PASSWORD $HARBOR_HOST
  script:
    - docker build -t $BACKEND_IMAGE_TAG -f deployments/Dockerfile .
    - docker push $BACKEND_IMAGE_TAG

build-frontend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $HARBOR_USERNAME -p $HARBOR_PASSWORD $HARBOR_HOST
  script:
    - docker build -t $FRONTEND_IMAGE_TAG -f web/frontend/Dockerfile web/frontend
    - docker push $FRONTEND_IMAGE_TAG

# -----------------------------------------------------
# 6. IMAGE TEST & PORTS CHECK
# -----------------------------------------------------
image-test-backend:
  stage: image-test
  image: gcr.io/gcp-runtimes/container-structure-test:latest
  services:
    - docker:24.0.5-dind
  script:
    - container-structure-test test --image $BACKEND_IMAGE_TAG --config tests/image/backend-config.yaml
  allow_failure: true

# -----------------------------------------------------
# 7. CONTAINER SECURITY SCANNING
# -----------------------------------------------------
container-scanning:
  stage: security-container
  image: aquasec/trivy:latest
  script:
    - trivy image --format table $BACKEND_IMAGE_TAG
    - trivy image --format template --template "@contrib/gitlab.tpl" --output gl-container-scanning-report.json $BACKEND_IMAGE_TAG
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json
  allow_failure: true

# -----------------------------------------------------
# 8. DEPLOY (Publish to K3s Cluster)
# -----------------------------------------------------
deploy-k3s:
  stage: deploy
  image: bitnami/kubectl:latest
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" > ~/.kube/config
    - chmod 600 ~/.kube/config
  script:
    - sed -i "s|image: deployments-gateway:latest|image: $BACKEND_IMAGE_TAG|g" deployments/k8s/06-backend.yaml
    - sed -i "s|image: deployments-frontend:latest|image: $FRONTEND_IMAGE_TAG|g" deployments/k8s/07-frontend.yaml
    
    # Deploy components (IoTDB removed, Postgres is unified TimescaleDB)
    - kubectl apply -f deployments/k8s/01-config.yaml
    - kubectl apply -f deployments/k8s/02-secrets.yaml
    - kubectl apply -f deployments/k8s/03-postgres.yaml
    - kubectl apply -f deployments/k8s/05-nats.yaml
    - kubectl apply -f deployments/k8s/06-backend.yaml
    - kubectl apply -f deployments/k8s/07-frontend.yaml
  only:
    - main
    - master

# -----------------------------------------------------
# 9. POST-DEPLOY DYNAMIC TESTING (Against Live K3s)
# -----------------------------------------------------
api-test:
  stage: post-deploy-test
  image: postman/newman:alpine
  script:
    - newman run tests/api/dvc-gateway.postman_collection.json --env-var "baseUrl=$K3S_APP_URL" --reporters cli,junit --reporter-junit-export report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  allow_failure: true

owasp-zap-dast:
  stage: post-deploy-test
  image: owasp/zap2docker-stable:latest
  script:
    - mkdir -p /zap/wrk
    - zap-baseline.py -t $K3S_APP_URL -r /zap/wrk/zap-report.html -J /zap/wrk/gl-dast-report.json || true
  artifacts:
    paths:
      - /zap/wrk/zap-report.html
    reports:
      dast: /zap/wrk/gl-dast-report.json
  allow_failure: true
